[package]
name = "estudio_d3d10"
version = "0.1.0"
edition = "2021"
description = "Estudio en Windows: cubo 3D con Direct3D 10"

[dependencies]
estudio_base = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
