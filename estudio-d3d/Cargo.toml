# BMOX: un cubo 3D por cada versión de Direct3D (9, 10, 11, 12)
# para estudiar cómo cambia la API y portearla a BMO-X.
#
#   cargo run -p bmox9  --release
#   cargo run -p bmox10 --release
#   cargo run -p bmox11 --release
#   cargo run -p bmox12 --release

[workspace]
resolver = "2"
members = ["base", "BMOX-9", "BMOX-10", "BMOX-11", "BMOX-12"]

[workspace.dependencies]
bmox_base = { path = "base" }
glam = "0.29"
windows = "0.58"

[profile.release]
opt-level = 3
