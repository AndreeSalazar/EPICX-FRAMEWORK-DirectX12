[package]
name = "estudio_base"
version = "0.1.0"
edition = "2021"
description = "Lo común de los cubos D3D en Windows: ventana Win32, bucle, compilador HLSL, captura a PNG"

[dependencies]
cubo-neutro = { workspace = true }
png = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
