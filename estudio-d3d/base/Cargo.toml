[package]
name = "bmox_base"
version = "0.1.0"
edition = "2021"
description = "BMOX: lo común a todos los cubos (ventana Win32, geometría, matrices, compilador HLSL)"

[dependencies]
glam = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
